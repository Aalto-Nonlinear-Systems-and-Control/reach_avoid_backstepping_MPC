# Environment of the experiments (Examples 1 and 2 of the article).
# Versions are the ones used for the data in the repository (macOS arm64).
#   conda env create -f environment.yml && conda activate rab_mpc
name: rab_mpc
channels:
  - conda-forge
dependencies:
  - python=3.11.0
  - numpy=2.4.6
  - scipy=1.17.1
  - sympy=1.14.0
  - matplotlib=3.10.9
  - joblib=1.5.3
  - pip
  - pip:
      - casadi==3.7.2
